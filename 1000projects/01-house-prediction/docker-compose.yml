services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://house:house@db:5432/house_api
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: house
      POSTGRES_PASSWORD: house
      POSTGRES_DB: house_api
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U house -d house_api"]
      interval: 5s
      timeout: 5s
      retries: 5
